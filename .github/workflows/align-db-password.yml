# Moves the database's password to match the DB_PASSWORD secret.
#
# Postgres fixes a role's password when the cluster is created and ignores
# POSTGRES_PASSWORD on every start after that, so .env and the cluster can
# disagree — and when they do, deploy.sh refuses to deploy rather than take the
# API down. This is how that disagreement gets settled in the direction the
# design already declares: GitHub secrets are the source of truth.
#
# It needs no existing password. Postgres trusts connections over its local
# unix socket, so a shell inside the db container may reset any role.
#
# Manual only, and it deploys django immediately afterwards on purpose: between
# the ALTER ROLE and the .env sync the running API holds a password the
# database no longer accepts, so the window must be closed, not left open.

name: Align DB password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to change the production database password'
        required: true
        default: 'no'

concurrency:
  group: deploy-django
  cancel-in-progress: false

jobs:
  align:
    if: inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Align the role, then deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DB_PASSWORD,SECRET_KEY,ALLOWED_HOSTS,ADMIN_USERNAME,ADMIN_EMAIL,ADMIN_PASSWORD
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /app
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            role="$(sed -n 's/^DB_USER=//p' .env | head -n1)"
            role="${role:-postgres}"
            # A role name is an identifier, not a literal, so it cannot be bound
            # as a parameter. Validate it instead of trying to quote it.
            case "$role" in
              ''|*[!a-zA-Z0-9_]*) echo "refusing: DB_USER is not a plain identifier" >&2; exit 1 ;;
            esac

            docker compose up -d --wait --wait-timeout 60 db >/dev/null

            # :'pw' makes psql quote the value as a SQL literal, so no character
            # in it can break out of the statement. The statement arrives on
            # stdin rather than through -c: psql substitutes variables only in
            # input it reads, and sends a -c string to the server untouched --
            # which fails with `syntax error at or near ":"`. Feeding it on
            # stdin also keeps the value out of psql's argv.
            printf "ALTER ROLE %s WITH PASSWORD :'pw';\n" "$role" \
              | docker compose exec -T db \
                  psql -U "$role" -v ON_ERROR_STOP=1 -v pw="$DB_PASSWORD" >/dev/null
            echo "role $role now matches the DB_PASSWORD secret"

            # Close the window: the running API still holds the old password.
            ./deploy.sh django
