# Deploys the API by running the platform repo's deploy.sh over SSH.
#
# The deployment logic lives in mainreport-platform, not here, so this file
# stays a caller: it hands over the configuration this repository owns and
# names the service. See that repo's README, "Deployment".
#
# There is deliberately no pull_request trigger. The workflow this replaced had
# one, which would have deployed every pull request over production.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Per-repository, so it cannot serialise against dashboard-nextjs — deploy.sh
# takes a lock on the server for that. This only collapses a burst of merges
# here into a single deploy of the newest commit.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Forwarded into the remote shell, where deploy.sh writes them into
          # /app/.env. DEBUG is absent on purpose: this app reads it without a
          # bool cast, so the string "False" is truthy and would turn debug ON.
          envs: DB_PASSWORD,SECRET_KEY,ALLOWED_HOSTS,ADMIN_USERNAME,ADMIN_EMAIL,ADMIN_PASSWORD
          command_timeout: 30m
          script: /app/deploy.sh django
