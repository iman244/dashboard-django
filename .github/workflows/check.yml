# Runs the test suite on every pull request and on main.
#
# This repository is public, so Actions minutes are free and unmetered; there
# is no reason for this gate not to exist. .githooks/pre-push runs the same
# command locally for faster feedback, but a hook can be skipped and this
# cannot — this is the gate, the hook is a convenience.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # settings/development.py points at localhost:5432 with these credentials,
    # so the service container matches it rather than the settings being
    # parameterised for CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qwer123456
          POSTGRES_DB: medical-dashboard
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7.0.1

      # Matches the Dockerfile's python:3.11-slim, so a dependency that breaks
      # on the version actually deployed fails here rather than on the server.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: medicaldashboard.settings.development
