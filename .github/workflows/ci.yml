# Test, then deploy — in that order, in one workflow.
#
# These were two files, and review caught the flaw: two workflows triggered by
# the same push run in parallel, so a merge that broke the tests deployed
# anyway while CI was still reporting it. One workflow with `needs` makes the
# ordering structural rather than a matter of timing.
#
# The deployment logic itself lives in mainreport-platform/deploy.sh; the job
# below hands over the configuration this repository owns and names the
# service. See that repo's README, "Deployment".
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are worth cancelling; a deploy is not. Killing
  # one mid-flight leaves the server in whatever state it had reached.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    # settings/development.py points at localhost:5432 with these credentials,
    # so the service container matches it rather than the settings being
    # parameterised for CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qwer123456
          POSTGRES_DB: medical-dashboard
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7.0.1

      # Matches the Dockerfile's python:3.11-slim, so a dependency that breaks
      # on the version actually deployed fails here rather than on the server.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: medicaldashboard.settings.development

  deploy:
    needs: test
    # Only pushed tags deploy. Branch pushes, PRs and manual runs check only.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # A release-candidate tag (1.2.0-rc.1) rehearses on staging; the plain tag
    # on the same commit (1.2.0) promotes it to production. See the platform
    # README, "Staging".
    #
    # Staging's configuration is the STAGING_* secrets, sent under the plain
    # names. Each one is written `staging && STAGING_X || !staging && X || ''`,
    # not `staging && STAGING_X || X`: GitHub's `a && b || c` returns c when b
    # is empty, so the short form would hand a staging run production's value
    # whenever a staging secret is missing. This way it gets an empty value, and
    # deploy.sh refuses to deploy without the password, secret key and
    # hostnames. Only ADMIN_* falls back to production's, so the account you
    # already know works on staging. Production's hostnames live in the
    # server's .env, and deploy.sh ignores API_HOST there; the production
    # literals below are only what the probes hit.
    env:
      DEPLOY_ENV: ${{ contains(github.ref_name, '-rc.') && 'staging' || 'production' }}
      WEB_HOST: ${{ contains(github.ref_name, '-rc.') && secrets.STAGING_WEB_HOST || !contains(github.ref_name, '-rc.') && 'mainreport.ir' || '' }}
      API_HOST: ${{ contains(github.ref_name, '-rc.') && secrets.STAGING_API_HOST || !contains(github.ref_name, '-rc.') && 'api.mainreport.ir' || '' }}
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DB_PASSWORD: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_DB_PASSWORD || env.DEPLOY_ENV != 'staging' && secrets.DB_PASSWORD || '' }}
          SECRET_KEY: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_SECRET_KEY || env.DEPLOY_ENV != 'staging' && secrets.SECRET_KEY || '' }}
          ALLOWED_HOSTS: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_ALLOWED_HOSTS || env.DEPLOY_ENV != 'staging' && secrets.ALLOWED_HOSTS || '' }}
          # The site's own origin. settings/production.py reads it, and its
          # https-only default would make browsers refuse every API call.
          CORS_ALLOWED_ORIGINS: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_CORS_ALLOWED_ORIGINS || env.DEPLOY_ENV != 'staging' && secrets.CORS_ALLOWED_ORIGINS || '' }}
          ADMIN_USERNAME: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_ADMIN_USERNAME || secrets.ADMIN_USERNAME }}
          ADMIN_EMAIL: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          # Arvan object storage. Local development uses MinIO from
          # mainreport-platform's `dev` compose profile instead. Staging never
          # receives production's storage keys: without STAGING_S3_* its image
          # uploads are off.
          S3_ENDPOINT_URL: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_S3_ENDPOINT_URL || env.DEPLOY_ENV != 'staging' && secrets.S3_ENDPOINT_URL || '' }}
          S3_ACCESS_KEY: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_S3_ACCESS_KEY || env.DEPLOY_ENV != 'staging' && secrets.S3_ACCESS_KEY || '' }}
          S3_SECRET_KEY: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_S3_SECRET_KEY || env.DEPLOY_ENV != 'staging' && secrets.S3_SECRET_KEY || '' }}
          S3_BUCKET: ${{ env.DEPLOY_ENV == 'staging' && secrets.STAGING_S3_BUCKET || env.DEPLOY_ENV != 'staging' && secrets.S3_BUCKET || '' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Forwarded into the remote shell, where deploy.sh writes them into
          # /app/.env. DEBUG is absent on purpose: this app reads it without a
          # bool cast, so the string "False" is truthy and would turn debug ON.
          # API_HOST matters only to a staging run, which writes it into
          # /app/.env.staging instead.
          envs: DEPLOY_ENV,DEPLOY_SHA,API_HOST,DB_PASSWORD,SECRET_KEY,ALLOWED_HOSTS,CORS_ALLOWED_ORIGINS,ADMIN_USERNAME,ADMIN_EMAIL,ADMIN_PASSWORD,S3_ENDPOINT_URL,S3_ACCESS_KEY,S3_SECRET_KEY,S3_BUCKET
          # Room to wait for the server's deploy lock while a Next.js build
          # holds it (deploy.sh waits up to an hour), then build: an hour and a
          # half covers both.
          command_timeout: 90m
          # /app is a clone of mainreport-platform, where deploy.sh lives. Nothing
          # else updates it, so refresh it here: the script has to be current at
          # the moment it runs, and it cannot update itself while bash is reading
          # it. A hard reset rather than a pull because nobody is here to resolve
          # a conflict; .env and .env.* are gitignored and survive it.
          script: |
            set -euo pipefail
            git -C /app fetch --quiet origin main
            git -C /app reset --quiet --hard origin/main
            chmod +x /app/deploy.sh
            /app/deploy.sh --env "$DEPLOY_ENV" django

      # A container can be "Up" and still answer 502. `docker compose ps` says
      # nothing about HTTP, so the deploy above can report success while the
      # site is unreachable -- which is exactly what happened on 2026-09-22,
      # and nobody on this team can check from their own machine because the
      # route to the server is filtered from Iran.
      #
      # Two vantage points, because they answer different questions. Inside the
      # server isolates the application: if Traefik cannot reach Django over
      # the loopback, no amount of network is to blame. From the runner is the
      # only unfiltered view of the public address anyone here has.
      - name: Does it actually serve? (from inside the server)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_ENV,WEB_HOST,API_HOST
          command_timeout: 5m
          script: |
            # Not `set -e`: every host must be probed and reported, and a
            # failing curl is the result, not an error to abort on.
            set -uo pipefail
            failed=0
            # Each probe names a path that proves something. `/` on the API is
            # NOT one of them: DRF has no root route, so it answers 404 whether
            # the app is healthy or not -- the first version of this check read
            # that as an outage. A real endpoint answering 401 proves routing,
            # DRF and the database are all live, because the permission class
            # had to run to refuse it.
            probe() {
              local host="$1" path="$2" code
              code="$(curl -sS -o /dev/null -m 15 -w '%{http_code}' \
                        -H "Host: ${host}" "http://127.0.0.1${path}" 2>/dev/null)"
              code="${code:-000}"
              echo "  ${host}${path} -> ${code}"
              # 401/403 are successes here: something served and chose to
              # refuse. 000, 5xx and 404 on a path that should exist are not.
              case "$code" in 2??|3??|401|403) ;; *) failed=1 ;; esac
            }
            probe "$WEB_HOST" /
            probe "$API_HOST" /api/saderat-bank-health-monitoring/monitoring-types/
            probe "$API_HOST" /static/admin/css/base.css
            echo
            echo "--- last 30 lines of ${DEPLOY_ENV} django, in case it answered badly ---"
            if [ "$DEPLOY_ENV" = staging ]; then
              docker compose -f /app/compose.staging.yml --env-file /app/.env.staging \
                logs --tail=30 --no-color django 2>&1 || true
            else
              docker compose -f /app/compose.yml logs --tail=30 --no-color django 2>&1 || true
            fi
            exit "$failed"

      - name: Does it actually serve? (from the runner, outside Iran)
        # Runs even when the check above failed, so one report shows both.
        if: always()
        run: |
          # +e, and it matters more here than it looks. This step asserts
          # nothing -- it reports -- but GitHub runs `run:` under `bash -e`,
          # and the https probes below are EXPECTED to fail while this stack
          # has no TLS listener. Without this the step dies on the first one
          # and takes the whole deploy red for a result it was only printing.
          set +e
          for url in \
            "http://${WEB_HOST}/" \
            "http://${API_HOST}/api/saderat-bank-health-monitoring/monitoring-types/"
          do
            code="$(curl -sS -o /dev/null -m 25 -w '%{http_code}' "$url" 2>/dev/null)"
            code="${code:-000}"
            echo "  ${url} -> ${code}"
          done
          # HTTPS is reported, never asserted: this stack has no TLS listener
          # at all, so 000 here is the expected answer until one is added. It
          # is printed because a browser tries HTTPS first, which is how the
          # 2026-09-22 outage looked to users while every container was Up.
          echo "  --- https, for information ---"
          for url in "https://${WEB_HOST}/" "https://${API_HOST}/"; do
            code="$(curl -sS -o /dev/null -m 15 -w '%{http_code}' "$url" 2>/dev/null)"
            code="${code:-000}"
            echo "  ${url} -> ${code}"
          done
